<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- ホーム画面に追加して開くと、アドレスバーなしの全画面で表示される -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>ぱんだの もり</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #eaf6ee;
    font-family: "BIZ UDPGothic", "Hiragino Maru Gothic ProN", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; }
  .btn {
    position: fixed;
    min-width: 56px; min-height: 56px;
    border: none; border-radius: 28px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 3px 10px rgba(90,140,110,0.25);
    font-size: 15px; font-family: inherit; color: #4e6b58;
    display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 0 18px;
    z-index: 10; cursor: pointer;
  }
  .btn:active { transform: scale(0.94); background: #ffffff; }
  #btnView { right: 14px; bottom: 14px; }
  #btnMute { left: 14px; bottom: 14px; }
  #hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.8); color: #5a7a66;
    padding: 8px 18px; border-radius: 20px; font-size: 13px;
    z-index: 10; pointer-events: none;
    transition: opacity 1.2s; white-space: nowrap;
  }
  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #fff; color: #b05a5a; font-size: 14px;
    padding: 24px; text-align: center; z-index: 99;
  }
</style>

<body>
<canvas id="cv"></canvas>
<button class="btn" id="btnView">🐼 ぜんたいを みる</button>
<button class="btn" id="btnMute">🔊 おと</button>
<div id="hint">じめんを タップすると ささが おけるよ / ぱんだを なでてみてね</div>
<div id="err"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   ぱんだの おひるね もり — panda flock relaxation sim
   ============================================================ */

const errBox = document.getElementById('err');
function fatal(e) {
  errBox.style.display = 'flex';
  errBox.textContent = 'よみこみに しっぱいしました: ' + (e && e.message ? e.message : e);
  console.error(e);
}

try { init(); } catch (e) { fatal(e); }

function init() {

/* ---------- constants ---------- */
const FIELD_R = 13;            // pandas stay inside this radius
const GROUND_R = 24;
const PANDA_COUNT = 8;
const MAX_BAMBOO = 5;
const NAMES = ['もちこ','くまきち','たんたん','ぽんず','ふくまる','ささみ','まろん','こつぶ','ゆきち','あんこ'];

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf6ee);
scene.fog = new THREE.Fog(0xdff2e6, 30, 70);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);

/* camera orbit state */
const cam = {
  yaw: 0.6, pitch: 0.42, radius: 20,
  target: new THREE.Vector3(0, 0.8, 0),
  focusPanda: null
};
function applyCamera() {
  const t = cam.target;
  const p = cam.pitch, y = cam.yaw, r = cam.radius;
  camera.position.set(
    t.x + r * Math.cos(p) * Math.sin(y),
    t.y + r * Math.sin(p),
    t.z + r * Math.cos(p) * Math.cos(y)
  );
  camera.lookAt(t);
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xfff8e7, 0xbfe3c5, 1.0));
const sun = new THREE.DirectionalLight(0xfff3d0, 1.4);
sun.position.set(12, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.far = 60;
scene.add(sun);

/* ---------- ground ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(GROUND_R, 48),
  new THREE.MeshLambertMaterial({ color: 0xa8dcae })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft light patches
const patchMat = new THREE.MeshLambertMaterial({ color: 0xc4ecc8 });
for (let i = 0; i < 10; i++) {
  const pr = 1.5 + Math.random() * 2.5;
  const patch = new THREE.Mesh(new THREE.CircleGeometry(pr, 24), patchMat);
  patch.rotation.x = -Math.PI / 2;
  const a = Math.random() * Math.PI * 2, d = Math.random() * (GROUND_R - 4);
  patch.position.set(Math.cos(a) * d, 0.01, Math.sin(a) * d);
  scene.add(patch);
}

/* ---------- bamboo forest ring ---------- */
const stalkMat = new THREE.MeshLambertMaterial({ color: 0x7cbf6b });
const stalkDarkMat = new THREE.MeshLambertMaterial({ color: 0x69a95c });
const nodeMat = new THREE.MeshLambertMaterial({ color: 0x5c9950 });
const leafMat = new THREE.MeshLambertMaterial({ color: 0x8ed07e, side: THREE.DoubleSide });

function makeLeafBlade(len) {
  // thin pointed blade, flattened almost to a plane
  const geo = new THREE.ConeGeometry(0.05, len, 4, 1);
  geo.scale(0.14, 1, 1);          // squash into a slender blade
  const m = new THREE.Mesh(geo, leafMat);
  return m;
}

function makeBambooStalk(h) {
  const g = new THREE.Group();
  const segMat = Math.random() < 0.5 ? stalkMat : stalkDarkMat;
  const segs = 3 + (Math.random() * 2 | 0);
  const segH = h / segs;
  const rTop = 0.028, rBot = 0.036;
  for (let i = 0; i < segs; i++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, segH * 0.94, 6), segMat);
    seg.position.y = segH * i + segH / 2;
    seg.castShadow = true;
    g.add(seg);
    if (i > 0) {
      // node ring between segments
      const node = new THREE.Mesh(new THREE.CylinderGeometry(rTop * 1.35, rTop * 1.35, segH * 0.06, 6), nodeMat);
      node.position.y = segH * i;
      g.add(node);
    }
  }
  // thin sasa-style leaves near the top, fanning outward
  const tufts = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < tufts; i++) {
    const len = 0.5 + Math.random() * 0.35;
    const leaf = makeLeafBlade(len);
    const ang = Math.random() * Math.PI * 2;
    const droop = 0.55 + Math.random() * 0.5;
    leaf.position.set(0, h * (0.62 + 0.34 * Math.random()), 0);
    leaf.rotation.y = ang;
    leaf.rotation.x = droop;              // tip droops outward/down like real sasa leaves
    leaf.translateY(len * 0.42);
    g.add(leaf);
  }
  return g;
}
for (let i = 0; i < 46; i++) {
  const a = (i / 46) * Math.PI * 2 + Math.random() * 0.12;
  const d = FIELD_R + 2.5 + Math.random() * 6;
  const b = makeBambooStalk(4 + Math.random() * 3.5);
  b.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
  scene.add(b);
}

/* ---------- canvas sprite helper (names, zzz, hearts) ---------- */
function textSprite(text, opts = {}) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.font = (opts.size || 44) + 'px "BIZ UDPGothic", sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  if (opts.bubble) {
    x.fillStyle = 'rgba(255,255,255,0.88)';
    const w = x.measureText(text).width + 44;
    roundRect(x, 128 - w / 2, 24, w, 80, 40);
    x.fill();
  }
  x.fillStyle = opts.color || '#5a7a66';
  x.fillText(text, 128, 66);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(2.2, 1.1, 1);
  return sp;
}
function roundRect(x, px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}
function heartSprite() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#ff9db2';
  x.beginPath();
  x.moveTo(32, 52);
  x.bezierCurveTo(6, 34, 10, 10, 32, 22);
  x.bezierCurveTo(54, 10, 58, 34, 32, 52);
  x.fill();
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(0.5, 0.5, 1);
  return sp;
}

/* floating effect pool (hearts / zzz) */
const floaters = [];
function spawnFloater(sprite, pos, life = 1.4) {
  sprite.position.copy(pos);
  scene.add(sprite);
  floaters.push({ sp: sprite, t: 0, life });
}
function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt;
    f.sp.position.y += dt * 0.9;
    f.sp.material.opacity = Math.max(0, 1 - f.t / f.life);
    if (f.t >= f.life) {
      scene.remove(f.sp);
      f.sp.material.map.dispose();
      f.sp.material.dispose();
      floaters.splice(i, 1);
    }
  }
}

/* ---------- audio (Web Audio, generated) ---------- */
let AC = null, master = null, muted = false, bgmTimer = 0;
const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25]; // C pentatonic-ish
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = 0.22;
  master.connect(AC.destination);
}
function tone(freq, dur, vol, type = 'sine', when = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxSqueak() {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(760, t0);
  o.frequency.linearRampToValueAtTime(1250, t0 + 0.07);
  o.frequency.linearRampToValueAtTime(880, t0 + 0.16);
  g.gain.setValueAtTime(0.14, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.25);
}
function sfxMunch() { tone(140 + Math.random() * 50, 0.09, 0.10, 'triangle'); }
function sfxChime() { tone(1046, 0.5, 0.08); tone(1318, 0.6, 0.06, 'sine', 0.08); }
function sfxLift() { tone(392, 0.12, 0.09); tone(523, 0.16, 0.09, 'sine', 0.1); }
function sfxDrop() { tone(330, 0.12, 0.09); tone(262, 0.2, 0.08, 'sine', 0.08); }
function updateBGM(dt) {
  if (!AC || muted) return;
  bgmTimer -= dt;
  if (bgmTimer <= 0) {
    bgmTimer = 1.15 + Math.random() * 0.4;
    const n = SCALE[(Math.random() * SCALE.length) | 0];
    tone(n, 1.6, 0.045);            // music-box note
    tone(n * 2, 1.2, 0.018);        // shimmer
    if (Math.random() < 0.3) tone(SCALE[0] / 2, 2.4, 0.03, 'sine', 0.2); // low pad
  }
}

/* ---------- panda factory ---------- */
const WHITE = new THREE.MeshLambertMaterial({ color: 0xfffdf7 });
const BLACK = new THREE.MeshLambertMaterial({ color: 0x3b3b40 });
const PATCH = new THREE.MeshLambertMaterial({ color: 0x3b3b40 });
const EYE = new THREE.MeshLambertMaterial({ color: 0x1c1c20 });
const HILITE = new THREE.MeshBasicMaterial({ color: 0xffffff });
const CHEEK = new THREE.MeshLambertMaterial({ color: 0xffc4cf });
const NOSE = new THREE.MeshLambertMaterial({ color: 0x2a2a2e });
const S = (r) => new THREE.SphereGeometry(r, 20, 16);

function makePandaMesh(traits) {
  const root = new THREE.Group();     // ground anchor
  const tilt = new THREE.Group();     // waddle / roll / sleep
  root.add(tilt);

  const bodyW = 0.42 * traits.chub;
  const body = new THREE.Mesh(S(bodyW), WHITE);
  body.scale.set(1, 0.92, 0.98);
  body.position.y = bodyW * 0.95;
  body.castShadow = true;
  tilt.add(body);

  const headR = 0.55;
  const head = new THREE.Mesh(S(headR), WHITE);
  head.position.y = bodyW * 1.6 + headR * 0.72;
  head.castShadow = true;
  tilt.add(head);

  // ears
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(S(0.18), BLACK);
    ear.position.set(sx * 0.36, 0.42, 0);
    head.add(ear);
  }
  // eye patches — a few shape variants per panda for individuality
  const eyeShapes = [
    { sy: 1.45, sz: 0.42, rot: -0.45, py: 0.06 },   // タレ目 droopy (original)
    { sy: 0.78, sz: 0.55, rot: -0.12, py: 0.02 },   // 横長 wide/horizontal
    { sy: 1.1, sz: 0.42, rot: 0.05, py: 0.05 },     // まん丸めアーモンド
    { sy: 1.0, sz: 0.48, rot: -0.62, py: 0.09 }     // つり目寄り slightly upswept
  ];
  const shape = eyeShapes[traits.eyeShape % eyeShapes.length];
  for (const sx of [-1, 1]) {
    const patch = new THREE.Mesh(S(0.155 * traits.patch), PATCH);
    patch.scale.set(1, shape.sy, shape.sz);
    patch.position.set(sx * 0.21, shape.py, headR * 0.86);
    patch.rotation.z = sx * shape.rot;
    head.add(patch);
    const eye = new THREE.Mesh(S(0.062), EYE);
    eye.position.set(sx * 0.20, shape.py - 0.005, headR * 0.99);
    eye.userData.isEye = true;
    head.add(eye);
    const hl = new THREE.Mesh(S(0.02), HILITE);
    hl.position.set(sx * 0.185, 0.085, headR * 1.045);
    head.add(hl);
    const cheek = new THREE.Mesh(S(0.075), CHEEK);
    cheek.scale.set(1, 0.7, 0.4);
    cheek.position.set(sx * 0.31, -0.12, headR * 0.9);
    head.add(cheek);
  }
  const nose = new THREE.Mesh(S(0.06), NOSE);
  nose.scale.set(1.2, 0.8, 0.7);
  nose.position.set(0, -0.06, headR * 1.0);
  head.add(nose);

  // limbs — round nubs
  for (const sx of [-1, 1]) {
    const arm = new THREE.Mesh(S(0.16), BLACK);
    arm.scale.set(0.8, 1.1, 0.8);
    arm.position.set(sx * bodyW * 0.95, bodyW * 1.25, 0.1);
    arm.castShadow = true;
    arm.userData.limb = 'arm';
    tilt.add(arm);
    const leg = new THREE.Mesh(S(0.17), BLACK);
    leg.scale.set(0.9, 0.85, 1.0);
    leg.position.set(sx * bodyW * 0.55, 0.16, 0.05);
    leg.castShadow = true;
    leg.userData.limb = 'leg';
    tilt.add(leg);
  }
  const tail = new THREE.Mesh(S(0.13), WHITE);
  tail.position.set(0, bodyW * 0.9, -bodyW * 1.05);
  tilt.add(tail);

  root.scale.setScalar(traits.size);
  root.userData.tilt = tilt;
  root.userData.head = head;
  return root;
}

/* ---------- panda behaviour ---------- */
const pandas = [];
const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

class Panda {
  constructor(i) {
    this.name = NAMES[i % NAMES.length];
    // personality
    const soc = Math.random();
    this.traits = {
      size: 0.85 + Math.random() * 0.3,
      chub: 0.9 + Math.random() * 0.25,
      patch: 0.85 + Math.random() * 0.35,
      speed: 0.6 + Math.random() * 0.6,       // walk speed
      act: 0.35 + Math.random() * 0.65,       // activity: chance to move / roll
      soc,                                    // cohesion weight
      loner: soc < 0.25,
      friendly: Math.random(),                // reaction to player
      eyeShape: (Math.random() * 4) | 0        // 0-3: eye patch shape variant
    };
    this.mesh = makePandaMesh(this.traits);
    // cache the tilt-group's local bounding box (before any position/rotation is applied)
    // so we can generically keep the panda above ground during roll/sleep, however the
    // limbs happen to be offset.
    const tiltForBox = this.mesh.userData.tilt;
    tiltForBox.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(tiltForBox);
    this.localMin = box.min.clone();
    this.localMax = box.max.clone();
    const a = Math.random() * Math.PI * 2, d = Math.random() * FIELD_R * 0.7;
    this.mesh.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    scene.add(this.mesh);

    this.vel = new THREE.Vector3();
    this.heading = Math.random() * Math.PI * 2;
    this.state = 'wander';
    this.stateT = 1 + Math.random() * 3;
    this.animT = Math.random() * 10;
    this.blinkT = 1 + Math.random() * 4;
    this.targetBamboo = null;
    this.petCharge = 0;
    this.label = null;
    this.labelT = 0;
    this.baseY = 0;
    this.radius = 0.55 * this.traits.size;   // for separation
    this.bodyH = 0.42 * this.traits.chub;    // matches makePandaMesh's bodyW, used to keep body above ground when tilted
  }

  /* --- state helpers --- */
  setState(s, t) {
    this.state = s;
    this.stateT = t;
    const tilt = this.mesh.userData.tilt;
    if (s !== 'sleep' && s !== 'roll') tilt.rotation.x = 0;
    if (s !== 'sleep') tilt.rotation.z = 0;
  }
  pickIdleState() {
    const r = Math.random(), act = this.traits.act;
    if (r < 0.30 * act) this.setState('roll', 1.4 + Math.random());
    else if (r < 0.5) this.setState('sit', 2.5 + Math.random() * 3);
    else if (r < 0.62) this.setState('sleep', 4 + Math.random() * 4);
    else this.setState('wander', 2 + Math.random() * 4);
  }

  showName() {
    if (this.label) { this.labelT = 2.2; return; }
    this.label = textSprite(this.name, { bubble: true, color: '#e58aa0', size: 46 });
    this.mesh.add(this.label);
    this.label.position.y = 1.9;
    this.labelT = 2.2;
  }

  reactToTap() {
    this.showName();
    sfxSqueak();
    const f = this.traits.friendly;
    if (this.state === 'carried') return;
    if (f > 0.66) this.setState('hopReact', 0.7);        // 人懐っこい: ぴょん
    else if (this.traits.act > 0.7) this.setState('roll', 1.2); // 活発: ころん
    else this.setState('tiltReact', 1.1);                // おっとり: 首かしげ
    // actually turn to face the camera right now (not just steer toward it later)
    const dx = camera.position.x - this.mesh.position.x;
    const dz = camera.position.z - this.mesh.position.z;
    const faceAngle = Math.atan2(dx, dz);
    this.mesh.rotation.y = faceAngle;
    this.heading = faceAngle;
  }

  pet(amount) {
    if (this.state === 'carried') return;
    this.petCharge += amount;
    if (this.petCharge > 1) {
      this.petCharge = 0;
      sfxChime();
      const h = heartSprite();
      const p = this.mesh.position.clone();
      p.y += 1.7 * this.traits.size;
      p.x += (Math.random() - 0.5) * 0.5;
      spawnFloater(h, p, 1.5);
      this.setState('happy', 1.2);
      this.showName();
    }
  }

  liftUp() { this.setState('carried', 9999); sfxLift(); this.showName(); }
  putDown() {
    this.setState('dropped', 0.6);
    this.vel.set(0, 0, 0);
    sfxDrop();
  }

  /* --- boids steering (only in wander / gotoBamboo) --- */
  steer(dt) {
    const p = this.mesh.position;
    const acc = tmpV.set(0, 0, 0);

    // separation (always strong)
    for (const o of pandas) {
      if (o === this) continue;
      const dx = p.x - o.mesh.position.x, dz = p.z - o.mesh.position.z;
      const d2 = dx * dx + dz * dz;
      const min = (this.radius + o.radius) * 1.7;
      if (d2 < min * min && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        acc.x += (dx / d) * (min - d) * 3.0;
        acc.z += (dz / d) * (min - d) * 3.0;
      }
    }
    // cohesion + gentle alignment (personality-weighted)
    if (!this.traits.loner && this.state === 'wander') {
      let cx = 0, cz = 0, vx = 0, vz = 0, n = 0;
      for (const o of pandas) {
        if (o === this) continue;
        const dx = o.mesh.position.x - p.x, dz = o.mesh.position.z - p.z;
        if (dx * dx + dz * dz < 36) { cx += dx; cz += dz; vx += o.vel.x; vz += o.vel.z; n++; }
      }
      if (n > 0) {
        acc.x += (cx / n) * 0.08 * this.traits.soc;
        acc.z += (cz / n) * 0.08 * this.traits.soc;
        acc.x += (vx / n) * 0.25 * this.traits.soc;
        acc.z += (vz / n) * 0.25 * this.traits.soc;
      }
    }
    // wander noise
    this.heading += (Math.random() - 0.5) * 1.6 * dt;
    acc.x += Math.sin(this.heading) * 0.45;
    acc.z += Math.cos(this.heading) * 0.45;

    // bamboo attraction
    if (this.targetBamboo) {
      const b = this.targetBamboo;
      const dx = b.pos.x - p.x, dz = b.pos.z - p.z;
      acc.x += dx * 0.5; acc.z += dz * 0.5;
    }
    // stay in field
    const d = Math.hypot(p.x, p.z);
    if (d > FIELD_R - 1) {
      acc.x -= (p.x / d) * (d - FIELD_R + 1) * 2.5;
      acc.z -= (p.z / d) * (d - FIELD_R + 1) * 2.5;
    }

    this.vel.x += acc.x * dt;
    this.vel.z += acc.z * dt;
    const maxV = 0.9 * this.traits.speed * (this.targetBamboo ? 1.5 : 1);
    const sp = Math.hypot(this.vel.x, this.vel.z);
    if (sp > maxV) { this.vel.x *= maxV / sp; this.vel.z *= maxV / sp; }
    p.x += this.vel.x * dt;
    p.z += this.vel.z * dt;
  }

  update(dt) {
    this.animT += dt;
    this.stateT -= dt;
    const tilt = this.mesh.userData.tilt;
    const head = this.mesh.userData.head;
    const p = this.mesh.position;

    // blink
    this.blinkT -= dt;
    if (this.blinkT <= 0) {
      this.blinkT = 2 + Math.random() * 4;
      head.children.forEach(c => { if (c.userData.isEye) { c.scale.y = 0.1; } });
      setTimeout(() => head.children.forEach(c => { if (c.userData.isEye) c.scale.y = 1; }), 120);
    }
    // name label fade
    if (this.label) {
      this.labelT -= dt;
      this.label.material.opacity = Math.min(1, this.labelT / 0.5);
      if (this.labelT <= 0) {
        this.mesh.remove(this.label);
        this.label.material.map.dispose();
        this.label.material.dispose();
        this.label = null;
      }
    }

    switch (this.state) {
      case 'wander': {
        this.steer(dt);
        const sp = Math.hypot(this.vel.x, this.vel.z);
        if (sp > 0.05) {
          const want = Math.atan2(this.vel.x, this.vel.z);
          this.mesh.rotation.y += shortAngle(this.mesh.rotation.y, want) * Math.min(1, dt * 6);
          // waddle
          tilt.rotation.z = Math.sin(this.animT * 9 * this.traits.speed) * 0.12;
          this.mesh.position.y = Math.abs(Math.sin(this.animT * 9 * this.traits.speed)) * 0.05;
        }
        if (this.targetBamboo) {
          if (this.targetBamboo.dead) this.targetBamboo = null;
          else {
            const d = Math.hypot(this.targetBamboo.pos.x - p.x, this.targetBamboo.pos.z - p.z);
            if (d < 1.1) this.setState('eatBamboo', 999);
          }
        } else if (this.stateT <= 0) { this.vel.multiplyScalar(0.3); this.pickIdleState(); }
        break;
      }
      case 'sit': {
        tilt.rotation.x = -0.15;
        this.mesh.position.y = 0.02;
        head.rotation.y = Math.sin(this.animT * 0.7) * 0.3;
        if (Math.random() < dt * 0.15) sfxMunch(); // idly nibbling grass
        if (this.stateT <= 0) { head.rotation.y = 0; this.mesh.position.y = 0; this.pickIdleState(); }
        break;
      }
      case 'sleep': {
        tilt.rotation.z = THREE.MathUtils.lerp(tilt.rotation.z, 1.3, dt * 3);
        const minY = lowestPointY(this);
        const targetY = minY < 0 ? -minY : 0;
        this.mesh.position.y = THREE.MathUtils.lerp(this.mesh.position.y, targetY, dt * 10);
        if (Math.random() < dt * 0.5) {
          const z = textSprite('ｚｚ', { color: '#8fb6d9', size: 40 });
          z.scale.set(1.1, 0.55, 1);
          spawnFloater(z, p.clone().add(tmpV2.set(0.3, 1.4, 0)), 1.6);
        }
        if (this.stateT <= 0) { this.mesh.position.y = 0; this.pickIdleState(); }
        break;
      }
      case 'roll': {
        tilt.rotation.x += dt * 6;
        const minY = lowestPointY(this);
        this.mesh.position.y = minY < 0 ? -minY : 0;
        p.x += Math.sin(this.mesh.rotation.y) * dt * 0.8;
        p.z += Math.cos(this.mesh.rotation.y) * dt * 0.8;
        const d = Math.hypot(p.x, p.z);
        if (d > FIELD_R) { p.x *= FIELD_R / d; p.z *= FIELD_R / d; }
        if (this.stateT <= 0) { tilt.rotation.x = 0; this.mesh.position.y = 0; this.setState('sit', 1 + Math.random()); }
        break;
      }
      case 'hopReact': {
        this.mesh.position.y = Math.abs(Math.sin(this.animT * 14)) * 0.35;
        if (this.stateT <= 0) { this.mesh.position.y = 0; this.setState('wander', 2); }
        break;
      }
      case 'tiltReact': {
        head.rotation.z = Math.sin(Math.min(1, (1.1 - this.stateT) * 3)) * 0.35;
        if (this.stateT <= 0) { head.rotation.z = 0; this.pickIdleState(); }
        break;
      }
      case 'happy': {
        tilt.rotation.z = Math.sin(this.animT * 16) * 0.14;
        this.mesh.position.y = Math.abs(Math.sin(this.animT * 8)) * 0.1;
        if (this.stateT <= 0) { tilt.rotation.z = 0; this.mesh.position.y = 0; this.pickIdleState(); }
        break;
      }
      case 'eatBamboo': {
        const b = this.targetBamboo;
        if (!b || b.dead) { this.targetBamboo = null; this.setState('sit', 1.5); break; }
        // face bamboo, munch
        const want = Math.atan2(b.pos.x - p.x, b.pos.z - p.z);
        this.mesh.rotation.y += shortAngle(this.mesh.rotation.y, want) * Math.min(1, dt * 5);
        head.position.y = (0.42 * this.traits.chub) * 1.6 + 0.55 * 0.72 + Math.sin(this.animT * 10) * 0.04;
        b.amount -= dt * 0.13;
        if (Math.random() < dt * 2.2) sfxMunch();
        if (b.amount <= 0) b.dead = true;
        break;
      }
      case 'carried': {
        // position is driven by pointer; jitter limbs
        tilt.children.forEach(c => {
          if (c.userData.limb) c.rotation.x = Math.sin(this.animT * 20 + c.position.x * 7) * 0.6;
        });
        tilt.rotation.z = Math.sin(this.animT * 12) * 0.1;
        break;
      }
      case 'dropped': {
        this.mesh.position.y = Math.max(0, this.mesh.position.y - dt * 6);
        if (this.mesh.position.y <= 0) {
          this.mesh.position.y = 0;
          const tiltG = this.mesh.userData.tilt;
          tiltG.children.forEach(c => { if (c.userData.limb) c.rotation.x = 0; });
          tiltG.rotation.z = 0;
          this.setState('sit', 1.2);
        }
        break;
      }
    }
  }
}
function shortAngle(a, b) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/* generic ground-clip guard: given a panda's cached local bounding box and its tilt
   group's current rotation, find how far the lowest corner dips below y=0, so callers
   can lift the whole panda by that amount and never clip through the ground. */
const _cornerTmp = new THREE.Vector3();
function lowestPointY(panda) {
  const min = panda.localMin, max = panda.localMax;
  const q = panda.mesh.userData.tilt.quaternion;
  let minY = Infinity;
  for (let ix = 0; ix < 2; ix++) for (let iy = 0; iy < 2; iy++) for (let iz = 0; iz < 2; iz++) {
    _cornerTmp.set(ix ? max.x : min.x, iy ? max.y : min.y, iz ? max.z : min.z);
    _cornerTmp.applyQuaternion(q);
    if (_cornerTmp.y < minY) minY = _cornerTmp.y;
  }
  return minY;
}

for (let i = 0; i < PANDA_COUNT; i++) pandas.push(new Panda(i));

/* hard overlap resolve */
function resolveOverlaps() {
  for (let i = 0; i < pandas.length; i++) {
    for (let j = i + 1; j < pandas.length; j++) {
      const a = pandas[i], b = pandas[j];
      if (a.state === 'carried' || b.state === 'carried') continue;
      const dx = b.mesh.position.x - a.mesh.position.x;
      const dz = b.mesh.position.z - a.mesh.position.z;
      const d = Math.hypot(dx, dz);
      const min = (a.radius + b.radius) * 1.15;
      if (d < min && d > 0.001) {
        const push = (min - d) / 2;
        const nx = dx / d, nz = dz / d;
        a.mesh.position.x -= nx * push; a.mesh.position.z -= nz * push;
        b.mesh.position.x += nx * push; b.mesh.position.z += nz * push;
      }
    }
  }
}

/* ---------- placeable bamboo (food) ---------- */
const bamboos = [];
function placeBamboo(x, z) {
  if (bamboos.length >= MAX_BAMBOO) {
    const old = bamboos.shift();
    old.dead = true;
    scene.remove(old.group);
  }
  const group = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const s = makeBambooStalk(1.4 + Math.random() * 0.5);
    s.position.set((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.4);
    group.add(s);
  }
  group.position.set(x, 0, z);
  scene.add(group);
  const b = { pos: new THREE.Vector3(x, 0, z), amount: 1, dead: false, group };
  bamboos.push(b);
  tone(523, 0.3, 0.07); tone(659, 0.35, 0.05, 'sine', 0.07);
  // nearby pandas get interested (friendlier ones from farther away)
  for (const pd of pandas) {
    const d = Math.hypot(pd.mesh.position.x - x, pd.mesh.position.z - z);
    const range = 4.5 + pd.traits.friendly * 4;
    if (d < range && pd.state !== 'carried') {
      pd.targetBamboo = b;
      if (pd.state !== 'wander') pd.setState('wander', 999);
    }
  }
}
function updateBamboos() {
  for (let i = bamboos.length - 1; i >= 0; i--) {
    const b = bamboos[i];
    if (b.dead) {
      scene.remove(b.group);
      bamboos.splice(i, 1);
      for (const pd of pandas) if (pd.targetBamboo === b) pd.targetBamboo = null;
      continue;
    }
    const s = 0.3 + b.amount * 0.7;
    b.group.scale.set(s, s, s);
  }
}

/* ---------- input ---------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const carryPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -2.0);

const pointers = new Map();
let mode = 'none';           // none | pandaPending | pet | carried | camera | pinch
let activePanda = null;
let longTimer = null;
let pinchStart = 0;
let lastPet = { x: 0, y: 0 };

function setNDC(x, y) {
  ndc.x = (x / window.innerWidth) * 2 - 1;
  ndc.y = -(y / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
}
function pandaAt(x, y) {
  setNDC(x, y);
  const meshes = [];
  pandas.forEach(pd => pd.mesh.traverse(o => { if (o.isMesh) { o.userData.panda = pd; meshes.push(o); } }));
  const hits = ray.intersectObjects(meshes, false);
  return hits.length ? hits[0].object.userData.panda : null;
}
function groundAt(x, y) {
  setNDC(x, y);
  const pt = new THREE.Vector3();
  return ray.ray.intersectPlane(groundPlane, pt) ? pt : null;
}

canvas.addEventListener('pointerdown', (e) => {
  ensureAudio();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointers */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() });

  if (pointers.size === 2) {
    clearTimeout(longTimer);
    if (mode === 'carried' && activePanda) activePanda.putDown();
    activePanda = null;
    mode = 'pinch';
    const [a, b] = [...pointers.values()];
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    return;
  }
  const pd = pandaAt(e.clientX, e.clientY);
  if (pd) {
    mode = 'pandaPending';
    activePanda = pd;
    lastPet.x = e.clientX; lastPet.y = e.clientY;
    longTimer = setTimeout(() => {
      if (mode === 'pandaPending' && activePanda) {
        mode = 'carried';
        activePanda.liftUp();
      }
    }, 550);
  } else {
    mode = 'cameraPending';
  }
});

canvas.addEventListener('pointermove', (e) => {
  const pt = pointers.get(e.pointerId);
  if (!pt) return;
  const dx = e.clientX - pt.x, dy = e.clientY - pt.y;
  pt.x = e.clientX; pt.y = e.clientY;
  const moved = Math.hypot(e.clientX - pt.sx, e.clientY - pt.sy);

  if (mode === 'pinch' && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchStart > 0) {
      cam.radius = THREE.MathUtils.clamp(cam.radius * (pinchStart / dist), 5, 34);
      pinchStart = dist;
    }
    return;
  }
  if (mode === 'pandaPending' && moved > 12) {
    clearTimeout(longTimer);
    mode = 'pet';
  }
  if (mode === 'pet' && activePanda) {
    const dist = Math.hypot(e.clientX - lastPet.x, e.clientY - lastPet.y);
    if (dist > 4) {
      const over = pandaAt(e.clientX, e.clientY);
      if (over === activePanda) activePanda.pet(dist / 260);
      lastPet.x = e.clientX; lastPet.y = e.clientY;
    }
  } else if (mode === 'carried' && activePanda) {
    setNDC(e.clientX, e.clientY);
    const pt3 = new THREE.Vector3();
    if (ray.ray.intersectPlane(carryPlane, pt3)) {
      const d = Math.hypot(pt3.x, pt3.z);
      if (d > FIELD_R) { pt3.x *= FIELD_R / d; pt3.z *= FIELD_R / d; }
      activePanda.mesh.position.lerp(tmpV2.set(pt3.x, 2.0, pt3.z), 0.35);
    }
  } else if (mode === 'cameraPending' && moved > 8) {
    mode = 'camera';
  }
  if (mode === 'camera') {
    cam.yaw -= dx * 0.005;
    cam.pitch = THREE.MathUtils.clamp(cam.pitch + dy * 0.004, 0.12, 1.25);
  }
});

function endPointer(e) {
  const pt = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  clearTimeout(longTimer);
  if (!pt) { mode = 'none'; return; }
  const quick = performance.now() - pt.t < 350;
  const still = Math.hypot(pt.x - pt.sx, pt.y - pt.sy) < 12;

  if (mode === 'pandaPending' && activePanda && quick && still) {
    activePanda.reactToTap();
    cam.focusPanda = activePanda;               // camera gently follows this panda
  } else if (mode === 'carried' && activePanda) {
    activePanda.putDown();
  } else if (mode === 'cameraPending' && quick && still) {
    const g = groundAt(pt.sx, pt.sy);
    if (g && Math.hypot(g.x, g.z) < FIELD_R + 2) {
      cam.focusPanda = null;
      placeBamboo(THREE.MathUtils.clamp(g.x, -FIELD_R + 1, FIELD_R - 1),
                  THREE.MathUtils.clamp(g.z, -FIELD_R + 1, FIELD_R - 1));
    }
  }
  if (pointers.size === 0) { mode = 'none'; activePanda = null; }
  else if (pointers.size === 1 && mode === 'pinch') { mode = 'cameraPending'; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.radius = THREE.MathUtils.clamp(cam.radius + e.deltaY * 0.02, 5, 34);
}, { passive: false });

// block double-tap zoom & context menu
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());

/* ---------- UI buttons ---------- */
document.getElementById('btnView').addEventListener('click', () => {
  ensureAudio();
  cam.focusPanda = null;
  cam.radius = 20; cam.pitch = 0.42;
});
const btnMute = document.getElementById('btnMute');
btnMute.addEventListener('click', () => {
  ensureAudio();
  muted = !muted;
  btnMute.textContent = muted ? '🔇 おと' : '🔊 おと';
});
setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 8000);

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 1 / 30);   // 120Hz-safe clamp

  for (const pd of pandas) pd.update(dt);
  resolveOverlaps();
  updateBamboos();
  updateFloaters(dt);
  updateBGM(dt);

  // camera target follows focus panda gently
  const want = cam.focusPanda
    ? tmpV.copy(cam.focusPanda.mesh.position).setY(0.9)
    : tmpV.set(0, 0.8, 0);
  cam.target.lerp(want, Math.min(1, dt * 2.5));
  if (cam.focusPanda && cam.radius > 12) cam.radius = THREE.MathUtils.lerp(cam.radius, 10, dt * 1.5);
  applyCamera();

  renderer.render(scene, camera);
}
applyCamera();
loop();

/* test hook */
window.__S = { pandas, bamboos, cam, camera, get frame() { return clock.elapsedTime; } };
window.__BOX3__ = THREE.Box3;

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

} // init
</script>
